{# Base template that renders a complete, self-contained HTML page with all content. #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="griffinfly.png" type="image/svg+xml">
    <title>Such Was Not</title>
    <style>
        {{ compiled_css | safe }}
    </style>
</head>
<body>
    <div id="reader" class="reader">
        <div class="reader__viewport">
            <div class="reader__content" id="reader-content">
                {% for section in sections %}
                <div class="content-section{% if section.is_image or section.is_slideshow %} content-section--image{% endif %}"
                     data-slug="{{ section.slug }}">
                    {{ section.html | safe }}
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="reader__controls">
            <button class="reader__nav reader__nav--home" id="home-page" aria-label="Home">&#8249;&#8249;</button>
            <button class="reader__nav reader__nav--prev" id="prev-page" aria-label="Previous page">&#8249;</button>
            <span class="reader__page-indicator" id="page-indicator">1 / 1</span>
            <button class="reader__nav reader__nav--next" id="next-page" aria-label="Next page">&#8250;</button>
            <button class="reader__nav reader__nav--end" id="end-page" aria-label="Home">&#8250;&#8250;</button>
        </div>
    </div>

    <script>
        {{ reader_js | safe }}
    </script>
</body>
</html>
